id: ISMSP-2.10.2
name: "ISMS-P 2.10.2 클라우드 보안"
clause: "2.10.2"
source_url: https://www.law.go.kr/LSW/admRulLsInfoP.do?admRulSeq=2100000244750
source_version: "개인정보보호위원회고시 제2024-8호 (2024. 7. 24. 일부개정) 별표 7"
summary_ko: "클라우드 서비스를 쓸 때 비인가 접근이나 설정 오류로 중요정보와 개인정보가 유출·노출되지 않도록 관리자 접근과 보안 설정 등에 대한 보호대책을 세워 이행해야 한다."
review:
  status: checked
  checked_by: "Claude (AI)"
  checked_at: 2026-11-04
  quote: "클라우드 서비스 이용 시 서비스 유형(SaaS, PaaS, IaaS 등)에 따른 비인가 접근, 설정 오류 등에 따라 중요정보와 개인정보가 유ㆍ노출되지 않도록 관리자 접근 및 보안 설정 등에 대한 보호대책을 수립ㆍ이행하여야 한다."
