summary_ko: "전자거래·핀테크 서비스는 정보유출이나 데이터 조작·사기를 막기 위해 인증·암호화 등 보호대책을 세우고, 결제시스템 등 외부 시스템과 연계할 때 안전성을 점검해야 한다."
