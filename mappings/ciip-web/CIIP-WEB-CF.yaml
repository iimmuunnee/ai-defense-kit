summary_ko: "로그인한 사용자의 세션을 악용한 위조 요청이 처리되지 않도록, 중요한 요청에 CSRF 토큰을 넣어 서버에서 검증하고 Referer/Origin 검증과 SameSite 쿠키로 불필요한 외부 도메인 요청을 막는지 점검한다."
