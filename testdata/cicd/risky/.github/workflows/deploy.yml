# 시험용 예제입니다. 값은 모두 자리 표시이고 실제 키는 없습니다.
name: deploy
on:
  push:
    branches: [main]

permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.EXAMPLE_KEY_ID }}
          aws-secret-access-key: ${{ secrets.EXAMPLE_SECRET }}
          aws-region: ap-northeast-2
      - run: ./deploy.sh
