# 확인함: PHP 매뉴얼은 eval에 사용자 데이터를 넣지 말고, exec류에는 escapeshellarg/escapeshellcmd를 쓰라고 한다.
# 참고: 입력이 같은 줄에 바로 들어가는 경우만 찾는다. 변수에 담아 다른 줄에서 쓰면 찾지 못한다. 구문 분석기가 아니라 줄 단위 추정이다.
# 인자 부분: 문자열, 괄호 쌍(두 겹까지), 안으로 들어가는 여는 괄호만 지나가므로 호출을 닫는 `)`와 문자열 밖의 `;`를 넘지 않는다.
#   한계: 입력 앞에 세 겹 이상 닫힌 괄호가 있으면 놓치고, 문자열 안의 `\"`나 짝이 안 맞는 따옴표가 있으면 어긋날 수 있다.
# 함수 이름 앞의 가장 가까운 글자가 단어 글자, `>`, `:`, `$`, `/`, `#`, `*`이면 찾지 않는다(메서드, 정의, 줄 끝 주석, 일반 문장).
#   한글 등 ASCII 밖의 글자 뒤도 찾지 않는다(주석과 문장). `<?php`, `echo`, `print`, `return`, `else`, `or`, `and`, `&&`, `||` 뒤는 찾는다.
#   `:` 뒤는 공백으로 둘러싼 삼항(` ? a : 함수(...)`), `?:`, `):` 뒤만 찾고 `::`는 찾지 않는다.
# 문장 끝(`;`, `{`, `}`)이나 여는 태그 바로 뒤의 `//`, `#` 주석은 가린다.
#   한계: `'o'=>함수(...)`, `case 1:함수(...)`, `$a?1:함수(...)`, `throw`, `yield`, `do` 뒤, `/* 주석 */ 함수(...)`는 놓친다.
#   한계: 문자열 안의 `; #`, `; //` 뒤도 주석으로 보므로 `함수("ls; # " . 입력)`을 놓친다.
#   한계: `foo() // 예전, 함수(...)`처럼 문장 끝이 아닌 곳의 주석과 `/* 설명, 함수(...) */`는 잘못 찾을 수 있다.
#   한계: `Press return 함수이름 (" . 입력`과 `<p>Please print 함수이름 (<?= 입력 ?>)`, 인라인 자바스크립트의 `re.exec("<?= 입력 ?>")`는 잘못 찾을 수 있다.
# 함수 이름과 SQL만 대소문자를 가리지 않는다. PHP의 슈퍼글로벌은 대소문자를 가리므로 `$_get`은 입력으로 보지 않는다.
# `assert`는 넣지 않는다: PHP 매뉴얼에 따르면 문자열을 코드로 평가하는 동작은 PHP 8에서 제거되었다. PHP 7 이하 프로젝트에서는 놓치며, 이 문장은 매뉴얼 원문을 다시 대조하지 않았다(확인 필요).
# 한계: `escapeshellarg(...)`는 안쪽에 괄호가 없을 때만 가린다. `escapeshellarg(trim(...))`는 잘못 찾을 수 있다. 문자열 안의 `"escapeshellarg(" . 입력 . ")"`도 가려서 놓친다.
#   HTML 줄 맨 앞이나 괄호 뒤의 `System (<?= 입력 ?>)` 같은 글도 잘못 찾을 수 있다.
id: PH-001
title: 코드나 명령 실행 함수에 사용자 입력이 바로 들어감
stacks: [php]
severity: critical
match:
  scope: line
  files: ["**/*.php", "**/*.phtml"]
  regex_requires: ["$_"]
  has_any_regex:
    - '(?:^|[^\s\w>:$/#*\x{80}-\x{10FFFF}]|<\?(?i:php)|\b(?i:echo|print|return|else|or|and)|\s\?\s[^;]*[^:]:|\?:|\):)\s*(?i:eval|system|exec|shell_exec|passthru|popen|proc_open|pcntl_exec)\s*\((?:[^()"'';]|"[^"]*"|''[^'']*''|\((?:[^()]|\([^()]*\))*\)|\()*(?:"[^"]*)?\$_(?:GET|POST|REQUEST|COOKIE)\b'
  mask_regex:
    - '(?:[;{}]|<\?(?i:php)?)\s*(?://|#).*'
    - '\b(?i:escapeshell(?:arg|cmd))\s*\([^()]*\)'
  skip_line_regex:
    - '^\s*(?://|#|\*|/\*)'
explain: explain/PH-001.md
fix: fixes/PH-001/
confidence: high
references:
  - url: https://www.php.net/manual/en/function.eval.php
    checked_at: 2026-11-06
  - url: https://www.php.net/manual/en/function.exec.php
    checked_at: 2026-11-06
