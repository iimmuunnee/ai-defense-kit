# 참고: `integrity` 없이 외부 주소(`https://`, `http://`, `//호스트`)에서 불러오는 `<script src=...>` 태그를 줄마다 알린다.
# 한계(놓침): `<script`와 `src=`가 다른 줄에 있는 여러 줄 태그는 알아보지 못한다.
# 한계(놓침): 같은 줄에 `integrity`가 있는 태그가 있으면 그 줄 전체를 넘어가므로, 같은 줄의 두 번째 태그는 놓친다.
# 한계(놓침): `<sCrIpT`처럼 대소문자를 섞은 태그 이름은 놓친다(`<script`, `<SCRIPT`, `<Script`만 거른다).
# 한계(놓침): 자바스크립트로 만들어 붙이는 스크립트(`document.createElement('script')`)는 보지 않는다.
# 한계(잘못 찾음): `<script src=...`는 한 줄에 있고 `integrity`가 다음 줄에 있으면 결과가 나온다.
# 한계(잘못 찾음): 내 서버의 절대 주소도 외부로 본다. 상대 경로(`/a.js`, `./a.js`, `a.js`)는 보지 않는다.
# 참고: `data-integrity=`처럼 이름 앞에 `-`가 붙은 속성은 `integrity`로 치지 않는다.
# 참고: 접속 환경마다 내용이 바뀌는 CDN 스크립트는 해시를 고정할 수 없어 SRI가 맞지 않는다. 설명에 적어 둔다.
# 참고: SRI와 CORS에 대한 설명은 MDN 문서를 기억에서 옮긴 것이며 원문을 다시 대조하지 않았다(확인 필요).
id: WEB-001
title: integrity 없이 외부에서 불러오는 스크립트
severity: low
match:
  scope: line
  files: ["**/*.{html,htm,xhtml,ejs,hbs,njk,vue,svelte,erb,twig,jsp,cshtml,php,phtml}"]
  regex_requires: ["<script", "<SCRIPT", "<Script"]
  has_any_regex:
    - '(?i)<script\b[^>]*\ssrc\s*=\s*["'']?(?:https?:)?//[a-z0-9]'
  skip_line_regex:
    - '(?i)(?:^|[^a-z0-9_-])integrity\s*='
    - '^\s*(?:<!--|//|/\*|\*|#)'
explain: explain/WEB-001.md
fix: fixes/WEB-001/
confidence: medium
