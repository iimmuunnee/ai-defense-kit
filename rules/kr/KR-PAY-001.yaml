# 확인함: 토스페이먼츠 공식 문서(Markdown 원문)를 직접 읽음 (2026-11-04)
#   웹훅 서명 헤더 `tosspayments-webhook-signature`, 검증 방법(`{WEBHOOK_PAYLOAD}:{tosspayments-webhook-transmission-time}`을
#   보안 키로 HMAC SHA-256, 헤더의 `v1:` 뒤 값을 base64 디코딩, `,`로 여러 개 가능, 하나라도 일치하면 정상)
#   - https://docs.tosspayments.com/reference/using-api/webhook-events.md
# 확인함: 공식 보안 체크리스트 "4. 웹훅 서명을 검증하고, 콜백을 https로 받아요"
#   "검증 없이 처리하면 위조된 결제 완료 통보로 상품이 나갈 수 있어요", 서명 검증 실패 시 요청 거부,
#   금액·주문번호는 결제 조회 API로 교차 확인(`orderId`·`totalAmount`·`mId`·`status`)
#   - https://docs.tosspayments.com/reference/using-api/security-checklist.md
# 확인함: 결제 조회 API 경로 `GET /v1/payments/{paymentKey}` 또는 `GET /v1/payments/orders/{orderId}`,
#   결제 웹훅은 paymentKey로 결제 조회 API를 다시 호출해 상태를 확인
#   - https://docs.tosspayments.com/guides/v2/get-started/llms-quick-reference.md
# 확인함: 가상계좌 DEPOSIT_CALLBACK의 `secret`을 결제 승인 응답의 `secret`과 비교, 이후 결제 조회에서는 `secret`이 null
#   - https://docs.tosspayments.com/guides/v2/payment-window/integration-virtual-account.md
# 확인함: npm 레지스트리의 토스 브라우저 SDK 패키지 `@tosspayments/tosspayments-sdk`, `payment-sdk`, `payment-widget-sdk`, `sdk`
#   (결제창, 프론트엔드 코드; 앞의 세 패키지는 repository가 github.com/tosspayments/browser-sdk, `@tosspayments/sdk`는 repository 표기 없음) - https://registry.npmjs.org/@tosspayments/tosspayments-sdk
# 확인함: 가상계좌 DEPOSIT_CALLBACK 본문 키는 `createdAt, orderId, secret, status, transactionKey`뿐이고 `eventType`이 없음
#   (테스트 상점 실험 1곳, 웹훅 2건) - docs/research/2026-11-04-rule-facts.md "Q1 실험 (2026-11-04)"
#   그래서 처리 코드에 "DEPOSIT_CALLBACK" 문자열이 없을 수 있어, 본문 모양으로도 찾음.
#   본문 모양 경로는 한 파일에 (1) 요청 처리 신호(`request.json(`, `req.body`, `@router.post(`, `export function POST`, `app.post(` 등)와
#   (2) `transactionKey`(또는 `transaction_key`)와 (3) `secret`이 모두 있어야 함. 순서는 상관없음.
#   DB 스키마/모델(컬럼만 있는 파일)과 요청 처리 신호가 없는 헬퍼 파일은 여기에 걸리지 않음.
# 확인 필요: 오탐 가능성: 결제 승인(confirm)을 SDK로 호출하면서(`/v1/payments/` 문자열 없음) POST 라우트 안에서
#   `secret`과 `transactionKey`를 둘 다 다루는 파일은 여전히 지적됨.
# 확인 필요: 놓칠 수 있음: 위 요청 처리 신호가 없는 프레임워크(예: 직접 만든 핸들러 규약, 다른 이름의 요청 객체)의 웹훅 핸들러.
# 확인 필요: 변수 이름이 `transactionKey`/`transaction_key`가 아닌 코드는 본문 모양으로 못 찾음.
# 확인 필요: 이 규칙은 검증 코드가 "있는지"만 봄. 검증이 올바른지, 실패했을 때 요청을 거부하는지는 보지 않음.
# 확인 필요: 공식 체크리스트는 서명 검증과 결제 재조회를 둘 다 하라고 하지만, 둘 중 하나만 있는 파일은 결과를 내지 않음.
# 확인 필요: 검증을 다른 파일(미들웨어 등)에서 하면 오탐이 됨.
# 확인 필요: `secret` 비교는 같은 줄에 `secret`과 비교 연산자(==, !=, ===, !==) 또는 `compare_digest(`가 있는지로 판단하므로,
#   같은 줄에 우연히 둘이 함께 있으면(예: `eventType === "DEPOSIT_CALLBACK"`과 `secret`) 놓칠 수 있음.
#   `secret`과 무관한 비교(예: `!!body.secret && body.status === "DONE"`)가 같은 줄에 있어도 검증으로 보고 결과를 내지 않음.
id: KR-PAY-001
title: 토스페이먼츠 웹훅 검증 누락
stacks: [fastapi, nextjs, php]
severity: high
match:
  scope: file
  files: ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.php"]
  has_any: ["PAYMENT_STATUS_CHANGED", "DEPOSIT_CALLBACK"]
  regex_requires: ["transactionKey", "transaction_key"]
  has_any_regex:
    - '(?s)(?:(?:\brequest\.json\(|\breq\.json\(|\brequest\.get_json\(|\breq\.body\b|\brequest\.body\b|@(?:app|router|bp|blueprint)\.(?:post|route)\(|\bexport\s+(?:async\s+)?function\s+POST\b|\bapp\.post\(|\brouter\.post\().*\b(?:transactionKey|transaction_key)\b.*\bsecret\b|(?:\brequest\.json\(|\breq\.json\(|\brequest\.get_json\(|\breq\.body\b|\brequest\.body\b|@(?:app|router|bp|blueprint)\.(?:post|route)\(|\bexport\s+(?:async\s+)?function\s+POST\b|\bapp\.post\(|\brouter\.post\().*\bsecret\b.*\b(?:transactionKey|transaction_key)\b|\b(?:transactionKey|transaction_key)\b.*(?:\brequest\.json\(|\breq\.json\(|\brequest\.get_json\(|\breq\.body\b|\brequest\.body\b|@(?:app|router|bp|blueprint)\.(?:post|route)\(|\bexport\s+(?:async\s+)?function\s+POST\b|\bapp\.post\(|\brouter\.post\().*\bsecret\b|\b(?:transactionKey|transaction_key)\b.*\bsecret\b.*(?:\brequest\.json\(|\breq\.json\(|\brequest\.get_json\(|\breq\.body\b|\brequest\.body\b|@(?:app|router|bp|blueprint)\.(?:post|route)\(|\bexport\s+(?:async\s+)?function\s+POST\b|\bapp\.post\(|\brouter\.post\()|\bsecret\b.*(?:\brequest\.json\(|\breq\.json\(|\brequest\.get_json\(|\breq\.body\b|\brequest\.body\b|@(?:app|router|bp|blueprint)\.(?:post|route)\(|\bexport\s+(?:async\s+)?function\s+POST\b|\bapp\.post\(|\brouter\.post\().*\b(?:transactionKey|transaction_key)\b|\bsecret\b.*\b(?:transactionKey|transaction_key)\b.*(?:\brequest\.json\(|\breq\.json\(|\brequest\.get_json\(|\breq\.body\b|\brequest\.body\b|@(?:app|router|bp|blueprint)\.(?:post|route)\(|\bexport\s+(?:async\s+)?function\s+POST\b|\bapp\.post\(|\brouter\.post\())'
    - '(?s)(?:(?:php://input|\$_POST\b|\$request->(?:all|input|json|getContent)\().*\b(?:transactionKey|transaction_key)\b.*\bsecret\b|(?:php://input|\$_POST\b|\$request->(?:all|input|json|getContent)\().*\bsecret\b.*\b(?:transactionKey|transaction_key)\b|\b(?:transactionKey|transaction_key)\b.*(?:php://input|\$_POST\b|\$request->(?:all|input|json|getContent)\().*\bsecret\b|\b(?:transactionKey|transaction_key)\b.*\bsecret\b.*(?:php://input|\$_POST\b|\$request->(?:all|input|json|getContent)\()|\bsecret\b.*(?:php://input|\$_POST\b|\$request->(?:all|input|json|getContent)\().*\b(?:transactionKey|transaction_key)\b|\bsecret\b.*\b(?:transactionKey|transaction_key)\b.*(?:php://input|\$_POST\b|\$request->(?:all|input|json|getContent)\())'
  missing_all:
    - "tosspayments-webhook-signature"
    - "HTTP_TOSSPAYMENTS_WEBHOOK_SIGNATURE"
    - "/v1/payments/"
    - "@tosspayments/"
  missing_all_regex:
    - '(?i)tosspayments-webhook-signature'
    - '\bsecret\b[^\n]{0,60}(?:===?|!==?|==|!=)'
    - '(?:===?|!==?|==|!=)[^\n]{0,60}\bsecret\b'
    - '\bcompare_digest\([^\n]*\bsecret\b'
    - '\bsecret\b[^\n]*\bcompare_digest\('
    - '\bhash_equals\([^\n]*\bsecret\b'
explain: explain/KR-PAY-001.md
fix: fixes/KR-PAY-001/
mappings: [ISMSP-2.10.4]
