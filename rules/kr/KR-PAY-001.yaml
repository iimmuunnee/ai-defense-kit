    checked_at: 2026-11-04
  - url: https://docs.tosspayments.com/guides/v2/get-started/llms-quick-reference.md
    checked_at: 2026-11-04
  - url: https://docs.tosspayments.com/guides/v2/payment-window/integration-virtual-account.md
    checked_at: 2026-11-04
