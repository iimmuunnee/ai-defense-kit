# 확인함: 포트원 공식 서버 SDK 문서 (2026-11-04)
#   JS/TS: Webhook.verify(secret, payload, headers)  - https://jsr.io/@portone/server-sdk/doc/~/Webhook
#   Python: portone_server_sdk.webhook.verify(secret, payload, headers) - https://pypi.org/project/portone-server-sdk/
# 확인함: 포트원 브라우저 SDK `@portone/browser-sdk`는 결제창(프론트엔드) 코드 (npm 레지스트리, 2026-11-04).
#   npm 패키지가 포트원 소유인지는 독립적으로 확인하지 못했음(레지스트리에 repository 필드 없음).
# 확인함: 공식 웹훅 문서가 "웹훅 메시지를 신뢰하지 않고, 결제 건의 상태를 포트원 API를 통해 새로 조회하여
#   이 응답만 신뢰하기"를 허용하며 예제에 `PortOne.PortOneClient(...)`를 씀 (2026-11-04)
#   portone-io/developers.portone.io src/routes/(root)/opi/ko/integration/webhook/readme-v2.mdx
#   (참고 URL은 저장소 주소만 적음: 기본 브랜치 이름을 확인하지 못했음)
# 확인 필요: 파일 안에 `PortOneClient` 또는 `@portone/browser-sdk`가 한 번이라도 나오면(주석 포함) 결과를 내지 않으므로 놓칠 수 있음.
# 확인 필요: 이 규칙은 한 파일 안의 문자열만 보므로, 검증을 다른 파일(미들웨어 등)에서 하면 오탐이 됨.
# 확인 필요: `webhook-signature`는 앞에 `-`나 글자가 붙지 않은 경우만 포트원 헤더로 봄. 토스페이먼츠의
#   `tosspayments-webhook-signature` 헤더 때문에 올바른 토스 웹훅 코드가 포트원 규칙에 걸리는 것을 막기 위함.
#   다른 업체의 `xxx-webhook-signature` 헤더도 놓치게 됨.
# 확인함: `api.portone.io/payments`는 모든 언어에서 재조회로 본다. 공식 웹훅 문서가 API로 새로 조회한 응답만 믿는 방식을 허용하기 때문이다.
# 확인 필요: 주소만 보므로 `/cancel`처럼 재조회가 아닌 주소도 넘어감. 받아들인 한계임.
# 확인 필요: `cdn.portone.io`나 `->verify(`가 파일에 있으면(주석 포함) 결과를 내지 않으므로 놓칠 수 있음. `->verify(`는 포트원과 무관한 객체일 수도 있음.
# 확인 필요: `hash_equals`는 같은 파일에 `HTTP_WEBHOOK_SIGNATURE`나 `webhook-signature`가 함께 있을 때만 검증으로 봄. 두 값을 비교하는지는 보지 않음.
# PHP 파일은 `webhook`(대소문자 무관)이나 `php://input`이 있을 때만 봄. `portone` 글자만 있는 설정 파일을 지적하지 않기 위함.
#   한계: 이 글자 없이 `$request->input(...)`만 쓰는 PHP 핸들러는 놓칠 수 있음. .ts, .js, .py는 기존처럼 `portone` 글자만으로 봄(오탐 가능).
id: KR-PAY-002
title: 포트원 웹훅 검증 누락
stacks: [fastapi, nextjs, php]
severity: high
match:
  scope: file
  files: ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.php"]
  has_any: ["portone"]
  has_any_regex: ['(?:^|[^-\w])webhook-signature', '\bHTTP_WEBHOOK_SIGNATURE\b']
  gate_files: ["**/*.php"]
  gate_regex: ['(?i)webhook|php://input']
  missing_all: ["Webhook.verify", "webhook.verify", "->verify(", "@portone/browser-sdk", "cdn.portone.io", "PortOneClient", "api.portone.io/payments"]
  missing_all_regex:
    - '(?is)(?:HTTP_WEBHOOK_SIGNATURE|webhook-signature).*hash_equals|hash_equals.*(?:HTTP_WEBHOOK_SIGNATURE|webhook-signature)'
explain: explain/KR-PAY-002.md
fix: fixes/KR-PAY-002/
mappings: [ISMSP-2.10.4]
confidence: medium
references:
  - url: https://jsr.io/@portone/server-sdk/doc/~/Webhook
    checked_at: 2026-11-04
  - url: https://pypi.org/project/portone-server-sdk/
    checked_at: 2026-11-04
  - url: https://registry.npmjs.org/@portone/browser-sdk
    checked_at: 2026-11-04
  - url: https://github.com/portone-io/developers.portone.io
    checked_at: 2026-11-04
