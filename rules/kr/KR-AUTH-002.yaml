# 확인함: 네이버 공식 Android SDK가 인가 요청에 state를 함께 보냄 (2026-11-04)
#   naver/naveridlogin-sdk-android Nid-OAuth/src/main/java/com/navercorp/nid/oauth/activity/NidOAuthQuery.kt
#   31행 REQUEST_AUTHORIZE_URL = "https://nid.naver.com/oauth2.0/authorize?", 80행 "state" to getOAuthState()
#   토큰 요청(data/service/NidOAuthLoginService.kt)에도 state를 넘김
#   (참고 URL은 저장소 주소만 적음: 기본 브랜치 이름을 확인하지 못했음)
# 확인 필요: 네이버 공식 문서에서 "state 필수", "콜백에서 검증" 문장을 확인하지 못함 (2026-11-04).
#   SDK 안에 `// TODO code 넣을때 state체크 처리해야 함.`(NidOAuthBridgeActivity.kt:322) 주석만 확인함.
# 확인 필요: RFC 원문을 이 환경에서 열지 못함 (2026-11-04). RFC 6749 10.12절의 문장은 인용하지 않았고, 아래 링크는 참고용 주소임.
# 확인 필요: 이 규칙은 인가 요청 쪽에 state가 있는지만 봄. 콜백에서 받은 state를 저장해 둔 값과 비교하는지는 보지 않음.
# 확인 필요: 한 파일 안에서 `state=`, `state:`, `"state",`, `?state=` 같은 글자가 한 번이라도 나오면(주석, 타입 선언 `(state: string)` 포함) 결과를 내지 않으므로 놓칠 수 있음.
#   `useState`, `setState`, `this.state`, `state.foo`, `[state, setState]`는 state 인자로 세지 않음.
#   PHP의 `$q['state'] = 값;`, `$this->q['state'] = 값;`도 state 인자로 센다. `$_SESSION['state'] =`는 세션 저장일 뿐이라 세지 않는다.
# 확인 필요: 인가 주소를 한 파일에 쓰고 state는 다른 파일에서 붙이면 오탐이 됨.
id: KR-AUTH-002
title: 네이버 로그인 state 누락
stacks: [nextjs, fastapi, react, php]
severity: medium
match:
  scope: file
  files: ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.php"]
  has_any: ["nid.naver.com/oauth2.0/authorize"]
  missing_all_regex:
    - '[?&]state='
    - "[\"']state[\"']\\s*[:=,]"
    - '(?:^|[^.\w$])state\s*[:=]\s*[^=]'
    - '\$[A-Za-z]\w*(?:->\w+)*\[["'']state["'']\]\s*=[^=]'
explain: explain/KR-AUTH-002.md
fix: fixes/KR-AUTH-002/
mappings: [CIIP-WEB-CF, PIPC-SAFE-5-5]
confidence: medium
references:
  - url: https://github.com/naver/naveridlogin-sdk-android
    checked_at: 2026-11-04
  # 확인 필요: 이 링크는 열지 못해 checked_at을 적지 않음
  - url: https://www.rfc-editor.org/rfc/rfc6749#section-10.12
