# 확인함: 카카오 공식 iOS SDK에서 인가 주소를 확인함 (2026-11-04)
#   kakao/kakao-ios-sdk Sources/KakaoSDKCommon/common/common/Urls.swift: kauth = "kauth.kakao.com"(38행), authAuthorize = "/oauth/authorize"(122행)
#   같은 SDK의 URL+Utils.swift:45 에서 `state` 쿼리 값을 읽는 코드를 확인함 (권고 문장은 아님)
#   (참고 URL은 저장소 주소만 적음: 기본 브랜치 이름을 확인하지 못했음)
# 확인 필요: 카카오 공식 문서에서 state 권고 문장을 확인하지 못함 (2026-11-04)
# 확인 필요: 인가 주소의 https 부분은 SDK에서 조립 코드를 읽지 못해 추정임.
# 확인 필요: RFC 원문을 이 환경에서 열지 못함 (2026-11-04). RFC 6749 10.12절의 문장은 인용하지 않았고, 아래 링크는 참고용 주소임.
# 확인 필요: 이 규칙은 인가 요청 쪽에 state가 있는지만 봄. 콜백에서 받은 state를 저장해 둔 값과 비교하는지는 보지 않음.
# 확인 필요: 한 파일 안에서 `state=`, `state:`, `"state",`, `?state=` 같은 글자가 한 번이라도 나오면(주석, 타입 선언 `(state: string)` 포함) 결과를 내지 않으므로 놓칠 수 있음.
#   `useState`, `setState`, `this.state`, `state.foo`, `[state, setState]`는 state 인자로 세지 않음.
#   PHP의 `$q['state'] = 값;`, `$this->q['state'] = 값;`도 state 인자로 센다. `$_SESSION['state'] =`는 세션 저장일 뿐이라 세지 않는다.
# 확인 필요: 인가 주소를 한 파일에 쓰고 state는 다른 파일에서 붙이면 오탐이 됨.
id: KR-AUTH-001
title: 카카오 로그인 state 누락
stacks: [nextjs, fastapi, react, php]
severity: medium
match:
  scope: file
  files: ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.php"]
  has_any: ["kauth.kakao.com/oauth/authorize"]
  missing_all_regex:
    - '[?&]state='
    - "[\"']state[\"']\\s*[:=,]"
    - '(?:^|[^.\w$])state\s*[:=]\s*[^=]'
    - '\$[A-Za-z]\w*(?:->\w+)*\[["'']state["'']\]\s*=[^=]'
explain: explain/KR-AUTH-001.md
fix: fixes/KR-AUTH-001/
mappings: [CIIP-WEB-CF, PIPC-SAFE-5-5]
confidence: low
references:
  - url: https://github.com/kakao/kakao-ios-sdk
    checked_at: 2026-11-04
  # 확인 필요: 이 링크는 열지 못해 checked_at을 적지 않음
  - url: https://www.rfc-editor.org/rfc/rfc6749#section-10.12
