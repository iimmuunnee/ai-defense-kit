# 확인함: Next.js 공식 자료 (2026-11-04)
#   vercel/next.js 저장소 canary 브랜치 docs/01-app/02-guides/authentication.mdx 1120행(미들웨어가 지금은 "Proxy"로 불린다):
#     "While Proxy can be useful for initial checks, it should not be your only line of defense in protecting your data."
#     "The majority of security checks should be performed as close as possible to your data source"
#   github/advisory-database 의 GHSA-f82v-jwr5-mffw(CVE-2025-29927) 권고 JSON:
#     "It is possible to bypass authorization checks within a Next.js application, if the authorization check occurs in middleware."
#     영향 범위(npm `next`): 12.0.0~12.3.4(수정 12.3.5), 13.0.0~13.5.8(수정 13.5.9), 14.0.0~14.2.24(수정 14.2.25), 15.0.0~15.2.2(수정 15.2.3).
#     11.x는 범위 목록에 없고 권고문이 우회 방법만 안내한다. 외부 요청의 `x-middleware-subrequest` 헤더를 앱에 닿기 전에 막으라고 권고한다.
#     Vercel에 배포한 앱은 자동으로 보호된다고 권고문에 적혀 있다. 이 규칙은 버전을 보지 않는다(취약한 `next` 버전은 의존성 점검이 따로 찾는다).
# 판단: 미들웨어에서 인증을 확인하는 것 자체는 문제가 아니다. 다만 그것만 믿으면 위 CVE처럼 한 번에 뚫리므로 "참고"(낮음)로만 알린다.
# 확인 필요: 다른 곳(라우트 핸들러, 서버 액션, 데이터 접근 계층)에서 다시 확인하는지는 보지 않는다. 미들웨어 파일 하나만 본다.
# 확인 필요: 공식 문서 문장은 canary(Proxy로 이름이 바뀐 판) 기준이다. 이전 이름(Middleware) 문서는 읽지 않았다.
# 확인 필요: CVSS 숫자는 권고 원문에 없다. 원문에 있는 것은 심각도 "CRITICAL"뿐이다.
# 참고: 대상 파일은 루트와 `src/`의 `middleware.{ts,js}`, `proxy.{ts,js}`뿐이다. `apps/web/middleware.ts` 같은 모노레포 하위 경로와 `.mjs`는 보지 않는다.
# 참고: 인증 신호는 글자만 본다. `session`/`authorization`(대소문자 무시), `cookies`, `/login`이 주석이나 문자열에 있어도 맞는다(오탐 가능).
#   `auth(`는 앞에 글자가 붙지 않은 호출(`auth()`, `await auth(`)만 본다(`oauth(`는 제외). 쿠키를 읽지 않는 로케일 리다이렉트 미들웨어, `NextResponse.next()`만 있는 미들웨어, 보안 헤더만 붙이는 미들웨어는 맞지 않는다.
# 참고(알려진 오탐): `request.cookies.get('NEXT_LOCALE')`처럼 쿠키를 읽는 로케일 미들웨어는 `cookies` 때문에 맞는다. CORS 헤더 목록에 `Authorization`을 적거나 API 프록시로 그 헤더를 넘기는 미들웨어도 맞을 수 있다.
# 참고: 인증 라이브러리 형태도 신호로 본다: `export { auth as middleware }`, `next-auth/middleware`, `withAuth(`, `clerkMiddleware(`, `.protect(`.
# 확인 필요: 위 인증 라이브러리 사용 형태는 각 라이브러리의 공식 문서와 대조해 확인하지 않았다(코드 모양만 보는 신호다).
id: NX-001
title: 미들웨어(Proxy)에서 인증을 확인함 - 그것만으로 보호하면 안 됨 (참고)
stacks: [nextjs]
severity: low
match:
  scope: file
  files:
    - "middleware.{ts,js}"
    - "proxy.{ts,js}"
    - "src/middleware.{ts,js}"
    - "src/proxy.{ts,js}"
  has_any_regex:
    - 'cookies'
    - 'getToken\('
    - '(?i)session'
    - '\bauth\('
    - '/login'
    - '(?i)authorization'
    - '\bauth\s+as\s+middleware\b'
    - 'next-auth/middleware'
    - '\bwithAuth\('
    - '\bclerkMiddleware\('
    - '\.protect\('
explain: explain/NX-001.md
fix: fixes/NX-001/
mappings: []
confidence: low
references:
  - url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/03/GHSA-f82v-jwr5-mffw/GHSA-f82v-jwr5-mffw.json
    checked_at: 2026-11-04
  - url: https://github.com/vercel/next.js/blob/canary/docs/01-app/02-guides/authentication.mdx
    checked_at: 2026-11-04
